# One-click deploy on Render: New + > Blueprint > pick this repository.
# A persistent disk keeps accounts and grades between restarts, and Render requires a paid plan for disks.
services:
  - type: web
    name: hadir
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
      - key: HADIR_SECRET
        generateValue: true
    disk:
      name: hadir-data
      mountPath: /var/data
      sizeGB: 1
